<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DMSERVICESCI - Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- SEO -->
<meta name="description" content="Contactez DMSERVICESCI pour vos services et solutions à Abidjan, Côte d’Ivoire.">
<meta name="keywords" content="DMSERVICESCI, contact, services, Abidjan, Côte d'Ivoire">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body,html{font-family:'Roboto',sans-serif;background:#f5f5f5;}

header{
  background:#4CAF50;color:white;
  padding:15px 20px;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:1000;
}
header h1{font-size:24px;}

nav{display:flex;gap:15px;}
nav a{color:white;font-weight:600;position:relative;text-decoration:none;}
nav a::after{
  content:"";position:absolute;width:0;height:2px;
  bottom:-4px;left:0;background:#FFD700;transition:0.3s;
}
nav a:hover::after{width:100%;}

.nav-toggle{display:none;flex-direction:column;gap:4px;cursor:pointer;}
.nav-toggle span{width:25px;height:3px;background:white;}

@media(max-width:768px){
  nav{position:absolute;top:60px;left:0;right:0;background:#4CAF50;flex-direction:column;display:none;}
  nav.active{display:flex;}
  .nav-toggle{display:flex;}
}

main{
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

.contact-box{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
}

.contact-box h2{
  text-align:center;
  margin-bottom:20px;
}

.contact-info{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.info{
  background:#f1f1f1;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

form{
  display:grid;
  gap:15px;
}

form input, form textarea{
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}

form textarea{resize:none;height:120px;}

form button{
  padding:12px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:50px;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
}

form button:hover{
  background:#45A049;
  transform:scale(1.05);
}

.whatsapp-btn{
  margin-top:20px;
  display:block;
  text-align:center;
  padding:12px;
  background:#25D366;
  color:white;
  border-radius:50px;
  font-weight:bold;
  text-decoration:none;
}

footer{
  margin-top:40px;
  text-align:center;
  padding:15px;
  background:#333;
  color:white;
}

/* Accessibilité */
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
}
</style>
</head>

<body>

<header>
<h1>DMSERVICESCI</h1>
<div class="nav-toggle" onclick="toggleNav()">
  <span></span><span></span><span></span>
</div>
<nav id="navMenu">
<a href="index.html">Accueil</a>
<a href="produits.html">Produits</a>
<a href="panier.html">Panier</a>
<a href="yango.html">Yango</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<main>
<div class="contact-box">
<h2>Contactez-nous</h2>

<div class="contact-info">
  <div class="info">
    📞 <strong>Téléphone</strong><br>
    +225 05 96 85 57 75
  </div>
  <div class="info">
    📧 <strong>Email</strong><br>
    dmsinfosci@gmail.com
  </div>
  <div class="info">
    📍 <strong>Localisation</strong><br>
    Abidjan, Côte d’Ivoire
  </div>
</div>

<form onsubmit="envoyerContact(event)">
  <label for="nom" class="sr-only">Nom</label>
  <input type="text" id="nom" placeholder="Votre nom" required minlength="2">

  <label for="email" class="sr-only">Email</label>
  <input type="email" id="email" placeholder="Votre email" required>

  <label for="message" class="sr-only">Message</label>
  <textarea id="message" placeholder="Votre message" required minlength="10"></textarea>

  <button type="submit">Envoyer le message</button>
</form>

<a class="whatsapp-btn" href="https://wa.me/2250596855775" target="_blank">
💬 Nous écrire sur WhatsApp
</a>

</div>
</main>

<footer>
&copy; 2026 DMSERVICESCI. Tous droits réservés.
</footer>

<script>
function toggleNav(){
  document.getElementById('navMenu').classList.toggle('active');
}

function envoyerContact(e){
  e.preventDefault();

  alert("Vous allez être redirigé vers WhatsApp pour envoyer votre message.");

  const nom = document.getElementById('nom').value;
  const email = document.getElementById('email').value;
  const message = document.getElementById('message').value;

  const texte = `Nom : ${nom}\nEmail : ${email}\nMessage : ${message}`;

  window.open(
    "https://wa.me/2250596855775?text=" + encodeURIComponent(texte),
    "_blank"
  );
}
</script>

</body>
</html>
