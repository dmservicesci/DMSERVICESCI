<style>
*{margin:0;padding:0;box-sizing:border-box;}
body,html{font-family:'Roboto',sans-serif;background:#f5f5f5;}
header{background:#4CAF50;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;}
header h1{font-size:24px;}
nav{display:flex;gap:15px;}
nav a{color:white;font-weight:600;text-decoration:none;position:relative;}
nav a::after{content:"";position:absolute;width:0;height:2px;bottom:-4px;left:0;background:#FFD700;transition:0.3s;}
nav a:hover::after{width:100%;}
.nav-toggle{display:none;flex-direction:column;gap:4px;cursor:pointer;}
.nav-toggle span{width:25px;height:3px;background:white;}
@media(max-width:768px){nav{position:absolute;top:60px;left:0;right:0;background:#4CAF50;flex-direction:column;display:none;} nav.active{display:flex;} .nav-toggle{display:flex;}}
main{max-width:900px;margin:50px auto;padding:20px;text-align:center;}
main h2{margin-bottom:20px;color:#333;}
main p{font-size:18px;color:#555;}
footer{text-align:center;padding:15px;background:#333;color:white;margin-top:30px;}
button, .btn{padding:12px 20px;background:#4CAF50;color:white;border:none;border-radius:50px;cursor:pointer;transition:0.3s;font-weight:bold;text-decoration:none;}
button:hover, .btn:hover{background:#45A049;}
</style>
</head>
<body>

<header>
<h1>DMSERVICESCI</h1>

</nav>

<a href="produits.html" class="btn">Voir nos produits</a>
</main>

<footer>
&copy; 2026 DMSERVICESCI. Tous droits réservés.
</footer>

function toggleNav(){document.getElementById('navMenu').classList.toggle('active');}
</script>
