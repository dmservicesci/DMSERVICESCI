<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DMSERVICESCI - Produits</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body,html{font-family:'Roboto',sans-serif;background:#f5f5f5;}

header{
  background:#4CAF50;color:white;
  padding:15px 20px;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:1000;
}
header h1{font-size:24px;}

nav{display:flex;gap:15px;}
nav a{color:white;font-weight:600;position:relative;}
nav a::after{
  content:"";position:absolute;width:0;height:2px;
  bottom:-4px;left:0;background:#FFD700;transition:0.3s;
}
nav a:hover::after{width:100%;}

.nav-toggle{display:none;flex-direction:column;gap:4px;cursor:pointer;}
.nav-toggle span{width:25px;height:3px;background:white;}

@media(max-width:768px){
  nav{position:absolute;top:60px;left:0;right:0;background:#4CAF50;flex-direction:column;display:none;}
  nav.active{display:flex;}
  .nav-toggle{display:flex;}
}

main{
  max-width:1000px;
  margin:30px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

/* ✅ CORRECTION IMAGE */
.card img{
  width:100%;
  height:200px;          /* hauteur fixe */
  object-fit:cover;      /* remplit sans déformer */
  border-radius:10px;
  margin-bottom:10px;
}

.card h3{margin-bottom:5px;}
.card p{font-weight:bold;margin-bottom:10px;}

.card button{
  width:100%;
  padding:10px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:50px;
  cursor:pointer;
  transition:0.3s;
}
.card button:hover{
  background:#45A049;
  transform:scale(1.05);
}

/* Popup */
#popup{
  position:fixed;
  top:20px;right:20px;
  background:#4CAF50;color:white;
  padding:15px 20px;
  border-radius:50px;
  display:none;
  opacity:0;
  transition:opacity 0.5s;
  z-index:9999;
}
#popup.show{display:block;opacity:1;}
#popup.hide{opacity:0;}

footer{
  text-align:center;
  padding:15px;
  background:#333;
  color:white;
}
</style>
</head>

<body>

<header>
<h1>DMSERVICESCI</h1>
<div class="nav-toggle" onclick="toggleNav()">
  <span></span><span></span><span></span>
</div>
<nav id="navMenu">
<a href="index.html">Accueil</a>
<a href="produits.html">Produits</a>
<a href="panier.html">Panier</a>
<a href="yango.html">Yango</a>
</nav>
</header>

<main>
<div class="card">
<img src="produit1.jpg" alt="Produit 1">
<h3>Produit 1</h3>
<p>10€</p>
<button onclick="ajouterPanier('Produit 1',10)">Ajouter au panier</button>
</div>

<div class="card">
<img src="produit2.jpg" alt="Produit 2">
<h3>Produit 2</h3>
<p>20€</p>
<button onclick="ajouterPanier('Produit 2',20)">Ajouter au panier</button>
</div>

<div class="card">
<img src="produit3.jpg" alt="Produit 3">
<h3>Produit 3</h3>
<p>30€</p>
<button onclick="ajouterPanier('Produit 3',30)">Ajouter au panier</button>
</div>
</main>

<div id="popup">Produit ajouté au panier ✔</div>

<footer>
&copy; 2026 DMSERVICESCI. Tous droits réservés.
</footer>

<script>
function toggleNav(){
  document.getElementById('navMenu').classList.toggle('active');
}

function ajouterPanier(nom, prix){
  let panier = JSON.parse(localStorage.getItem('panier') || '[]');
  panier.push({nom, prix:Number(prix)});
  localStorage.setItem('panier', JSON.stringify(panier));
  showPopup();
}

function showPopup(){
  const popup = document.getElementById('popup');
  popup.classList.remove('hide');
  popup.classList.add('show');
  setTimeout(()=>{
    popup.classList.remove('show');
    popup.classList.add('hide');
  },1500);
}
</script>

</body>
</html>
