<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DMSERVICESCI - Produits</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4CAF50;
  --hover:#45A049;
  --bg:#f5f5f5;
  --shadow:0 4px 12px rgba(0,0,0,0.1);
}
body, html{margin:0;padding:0;font-family:'Roboto',sans-serif;background:var(--bg);}
header{
  background:var(--primary);
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;top:0;
  z-index:1000;
}
header h1{font-size:24px;}
nav{display:flex;gap:15px;}
nav a{color:white;text-decoration:none;font-weight:600;position:relative;}
nav a::after{content:"";position:absolute;width:0;height:2px;bottom:-3px;left:0;background:#FFD700;transition:0.3s;}
nav a:hover::after{width:100%;}
.nav-toggle{display:none;flex-direction:column;gap:4px;cursor:pointer;}
.nav-toggle span{width:25px;height:3px;background:white;}
@media(max-width:768px){
  nav{position:absolute;top:60px;left:0;right:0;background:var(--primary);flex-direction:column;display:none;}
  nav.active{display:flex;}
  .nav-toggle{display:flex;}
}
main{
  max-width:1000px;margin:30px auto;padding:0 15px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:white;padding:15px;border-radius:12px;box-shadow:var(--shadow);
  transition:0.3s, transform 0.3s;
}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(0,0,0,0.2);}
.card img{width:100%;height:200px;object-fit:cover;border-radius:10px;margin-bottom:10px;}
.card h3{margin-bottom:5px;}
.card p{font-weight:bold;margin-bottom:10px;}
.card button{
  width:100%;padding:10px;background:var(--primary);
  color:white;border:none;border-radius:50px;cursor:pointer;transition:0.3s;
}
.card button:hover{background:var(--hover);transform:scale(1.05);}
footer{text-align:center;padding:15px;background:#333;color:white;margin-top:40px;}
</style>
</head>
<body>
<header>
<h1>DMSERVICESCI</h1>
<div class="nav-toggle" onclick="toggleNav()"><span></span><span></span><span></span></div>
<nav id="navMenu">
  <a href="index.html">Accueil</a>
  <a href="produits.html">Produits</a>
  <a href="panier.html">Panier</a>
  <a href="yango.html">Yango</a>
  <a href="contact.html">Contact</a>
</nav>
</header>

<main>
<div class="card">
  <img src="images/produit1.jpg" alt="Produit 1">
  <h3>Produit 1</h3>
  <p>10 000 CFA</p>
  <button onclick="ajouterPanier('Produit 1',10000)">Ajouter au panier</button>
</div>
<div class="card">
  <img src="images/produit2.jpg" alt="Produit 2">
  <h3>Produit 2</h3>
  <p>20 000 CFA</p>
  <button onclick="ajouterPanier('Produit 2',20000)">Ajouter au panier</button>
</div>
<div class="card">
  <img src="images/produit3.jpg" alt="Produit 3">
  <h3>Produit 3</h3>
  <p>30 000 CFA</p>
  <button onclick="ajouterPanier('Produit 3',30000)">Ajouter au panier</button>
</div>
</main>

<footer>
&copy; 2026 DMSERVICESCI. Tous droits réservés.
</footer>

<script>
function toggleNav(){document.getElementById('navMenu').classList.toggle('active');}

function ajouterPanier(nom, prix){
  let panier = JSON.parse(localStorage.getItem('panier')||'[]');
  panier.push({nom, prix});
  localStorage.setItem('panier', JSON.stringify(panier));
  alert(nom + ' a été ajouté au panier.');
}
</script>
</body>
</html>
